name: Research messages (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Parser unit tests
        run: python -m unittest discover -s tests -v
      - name: Research source pages (no publication)
        run: python scripts/sync_messages.py --output research-output
      - name: Summarize research findings
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("research-output/report.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              if not report_path.exists():
                  out.write("## Import did not produce a report\nNo texts were published.\n")
              else:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  out.write("## Medjugorje import diagnostics\n")
                  out.write("**Status: UNVERIFIED RESEARCH, NOT FOR PUBLICATION**\n\n")
                  out.write("| Language | Records | Missing linked IDs |\n|---|---:|---:|\n")
                  for lang, data in report["languages"].items():
                      out.write(f'| {lang} | {data["unique_messages"]} | {len(data["missing_ids"])} |\n')
                  for lang, data in report["languages"].items():
                      for message in data["warnings"]:
                          out.write(f'\n- **{lang}**: {message}\n')
                  if report["warnings"]:
                      out.write("\n**The importer failed validation. Do not treat the archive as complete.**\n")
          PY
      - name: Upload private research archive and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medjugorje-research
          path: research-output/
          retention-days: 14
          if-no-files-found: warn
