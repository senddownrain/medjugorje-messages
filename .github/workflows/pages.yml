name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run check:data && npm run check:search-metadata && npm run test:search
      - run: python -m unittest discover -s tests -v
      - run: npm run test:search:browser
      - run: npm run build
      - run: python scripts/check-dist.py
      - run: npm run test:ui:browser -- --output work/release-browser
      - run: npm run test:startup -- --output work/pwa-updates.json
      - name: Upgrade cached previous public release to the new branding
        run: python scripts/check-branding-upgrade.py --output work/branding-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests
          path: |
            work/release-browser
            work/pwa-updates.json
            work/branding-upgrade
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check anonymous public HTTPS and capture mobile screenshots
        run: python scripts/check-release-browser.py --url https://senddownrain.github.io/medjugorje-messages/ --expected-sha "$GITHUB_SHA" --output work/public-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-release-proof
          path: work/public-release
          retention-days: 30
