name: PWA preview build (private)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements.txt
      - name: Test archive parsers and cloud tooling
        run: python -m unittest discover -s tests -v
      - name: Validate all seven language files and text checksums
        run: npm run check:data
      - name: Compile Vue PWA with offline seven-language archive
        run: npm run build:private
      - name: Upload private build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: medjugorje-pwa-preview
          path: dist/
          retention-days: 14
          if-no-files-found: error
